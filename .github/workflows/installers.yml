# CI for this fork: the install and sync scripts, and the casadei schema.
#
# Named installers.yml rather than ci.yml because upstream ships its own
# .github/workflows/ci.yml. tools/sync-upstream.sh keeps this file as-is on
# every upstream merge.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Weekly, so a new CLI release that breaks the schema is caught even when
  # nothing here changes.
  schedule:
    - cron: '0 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: shellcheck tools/*.sh tools/tests/*.sh

  bash:
    name: bash scripts (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - run: ./tools/tests/install.test.sh
      - run: ./tools/tests/sync-upstream.test.sh

  powershell:
    name: PowerShell scripts (${{ matrix.shell }})
    strategy:
      fail-fast: false
      matrix:
        shell: [pwsh, powershell]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - shell: pwsh
        run: ./tools/tests/install.tests.ps1 -Shell ${{ matrix.shell }}
      - shell: pwsh
        run: ./tools/tests/sync-upstream.tests.ps1 -Shell ${{ matrix.shell }}

  schema:
    name: Schema validates (${{ matrix.cli }} CLI)
    strategy:
      fail-fast: false
      matrix:
        # npm:      the release users install, per the README.
        # upstream: built from the newest upstream commit merged into this
        #           fork - the exact version this fork claims to track.
        cli: [npm, upstream]
    runs-on: ubuntu-24.04
    env:
      OPENSPEC_TELEMETRY: '0'
      COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
    steps:
      - uses: actions/checkout@v7
        with:
          # The upstream build needs history to find the merged upstream commit.
          fetch-depth: ${{ matrix.cli == 'upstream' && '0' || '1' }}
      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install the CLI from npm
        if: matrix.cli == 'npm'
        run: |
          npm install -g @fission-ai/openspec@latest
          echo "OPENSPEC=openspec" >> "$GITHUB_ENV"

      - name: Build the CLI from the merged upstream commit
        if: matrix.cli == 'upstream'
        run: |
          git fetch --no-tags --quiet https://github.com/Fission-AI/OpenSpec.git main
          base="$(git merge-base HEAD FETCH_HEAD)"
          echo "Upstream commit: $(git log -1 --format='%h %s' "$base")"
          cli="$RUNNER_TEMP/openspec-upstream"
          git worktree add --quiet --detach "$cli" "$base"
          cd "$cli"
          corepack pnpm install --frozen-lockfile --ignore-scripts
          corepack pnpm run build
          echo "OPENSPEC=node $cli/bin/openspec.js" >> "$GITHUB_ENV"

      - name: Install into a fresh project and validate
        run: |
          $OPENSPEC --version
          project="$(mktemp -d)"
          (cd "$project" && $OPENSPEC init --tools none < /dev/null)
          ./tools/install.sh --project "$project" --claude --secrets high
          cd "$project"
          grep -qx 'schema: casadei' openspec/config.yaml
          grep -qx '# BEGIN openspec-casadei: secrets' .gitignore
          test -f .pre-commit-config.yaml
          test -f .github/workflows/secret-scan.yml
          test -f openspec/secrets-policy.md
          $OPENSPEC schema which casadei | tee which.txt
          grep -q 'Source: project' which.txt
          $OPENSPEC schema validate casadei
