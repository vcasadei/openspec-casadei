# Written by openspec-casadei (install --secrets). Blocks a commit whose staged
# changes contain a secret. Turn it on once per clone:
#
#   pre-commit install
#
# https://pre-commit.com - install with `pipx install pre-commit` or
# `brew install pre-commit`.
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
